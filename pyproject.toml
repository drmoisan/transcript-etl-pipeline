[tool.poetry]
name = "transcript-etl-pipeline"
version = "0.1.0"
description = "Extract, transform, and format meeting transcripts with speaker detection and multiple output formats"
authors = ["Dan Moisan <drmoisan@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "transcript_etl_pipeline", from = "src" }]

[tool.poetry.scripts]
transcript-etl = "transcript_etl_pipeline.cli:main"

[tool.poetry.dependencies]
python = "^3.12"
python-docx = "^1.1.0"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
ruff = "^0.6.8"
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
pyright = "^1.1.389"
pre-commit = "^4.0.1"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = ["ANN101", "ANN102"]
fixable = ["ALL"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/.venv/**"]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = true
reportUnknownVariableType = true

