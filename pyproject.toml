[tool.poetry]
name = "transcript-etl-pipeline"
version = "0.1.0"
description = "Extract, transform, and format meeting transcripts with speaker detection and multiple output formats"
authors = ["Dan Moisan <drmoisan@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "transcript_etl_pipeline", from = "src" }]

[tool.poetry.scripts]
transcript-etl = "transcript_etl_pipeline.cli:main"

[tool.poetry.dependencies]
python = "^3.12"
python-docx = "^1.1.0"
english-words = "^2.0.2"
nltk = "^3.9.2"
numpy = "^2.3.5"
tzdata = "^2025.3"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
ruff = "^0.6.8"
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
pyright = "^1.1.389"
pre-commit = "^4.0.1"
vulture = "^2.14"
pyinstrument = "^5.1.1"
snakeviz = "^2.2.2"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = ["ANN101", "ANN102"]
fixable = ["ALL"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/.venv/**"]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = true
reportUnknownVariableType = true

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
# Initial fail-under floor: 15% (current coverage ~16%)
# Plan to ratchet up as coverage improves:
# - After initial stabilization: raise to 20%
# - After core module coverage: raise to 30%
# - Long-term goal: 50%+ as test coverage expands
fail_under = 15
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]